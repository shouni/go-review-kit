# The CI itself lives in shouni/workflows. The reasons for the job layout and tag handling are in its README.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # The repair and decoding scan model output (external input) by hand. Run the exploration every time.
      fuzz-targets: "./review#FuzzSanitizeJSON ./review#FuzzParseReport"
      fuzz-time: 60s
