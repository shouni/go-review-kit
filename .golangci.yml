version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    # ★ This library clones **external, untrusted repositories** and handles the paths and
    # files inside them. Path joining, file reads and writes, and subprocess launches are
    # attack surface, so the security linter cannot be dropped.
    - gosec
    # Sentinel errors (review/errors.go) are exported, and consumers branch with errors.Is/As.
    # This linter is the only one that finds == comparisons and misuse of %v.
    - errorlint
    - copyloopvar
    - unconvert
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
    gosec:
      excludes:
        # G104 is disabled because it duplicates errcheck.
        - G104
  exclusions:
    rules:
      # These are places where tests read fixtures they created themselves, not external input.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
